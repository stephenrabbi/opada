name: Opada UI screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/ui-screenshots.mjs'
      - '.github/workflows/ui-screenshots.yml'
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start isolated preview
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/opada-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/opada-dev.log
          exit 1
      - run: node scripts/ui-screenshots.mjs
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opada-responsive-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore
